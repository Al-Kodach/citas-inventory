ktor {
    application {
        modules = [
            com.citacomsys.citas.server.ApplicationKt.module
        ]
        baseUrl = ${?BASE_URL}
    }

    deployment {
        watch = [ classes, resources ]
    }

    environment = "dev"
    environment = ${?ENV}
}

# File storage
app {
    storage {
        base_dir = ${?APP_DATA_DIR}
        base_dir = "./files"

        # All other directories are defined relative to the base directory.
        uploads_subdir = "uploads"
        backups_subdir = "backups"
        logs_subdir = "logs"
    }

    # Base path where the application is served.
    basePath = ${?BASE_PATH}
}

hubtel {
    clientId=${?HUBTEL_CLIENT_ID}
    clientSecret=${?HUBTEL_CLIENT_SECRET}
    senderId=${?HUBTEL_SENDER_ID}
    senderName=${?HUBTEL_SENDER_NAME}
}

session {
    secret=${?SESSION_SECRET}
    secret="session_secret"
}

database {
    url = ${?POSTGRES_URL}
    user = ${?POSTGRES_USER}
    password = ${?POSTGRES_PASSWORD}
    poolSize = ${?DB_POLL_SIZE}
}

jwt {
    audience = ${?JWT_AUDIENCE}
    issuer = ${?JWT_ISSUER}
    user_refresh_secret = ${?JWT_AUTH_REFRESH_SECRET}
    user_access_secret = ${?JWT_AUTH_ACCESS_SECRET}
    device_secret = ${?JWT_DEVICE_SECRET}
    access_token_duration_minutes = ${?JWT_ACCESS_TOKEN_DURATION_MIN}
    refresh_token_duration_days = ${?JWT_REFRESH_TOKEN_DURATION_DAYS}
    device_token_duration_days = ${?JWT_DEVICE_TOKEN_DURATION_DAYS}
}

notification {
    retry {
        maxRetries = ${?MAX_RETRIES}
        maxRetries = 2

        baseDelayMillis = ${?BASE_DELAY_MILLIS}
        baseDelayMillis = 200,

        maxDelayMillis = ${?MAX_DELAY_MILLIS}
        maxDelayMillis = 10000,

        jitterMinFactor = ${?JITTER_MIN_FACTOR}
        jitterMinFactor = 0.9,

        jitterMaxFactor = ${?JITTER_MAX_FACTOR}
        jitterMaxFactor = 1.1
    }
}